[project]
name = "6dx"
version = "0.1.0"
description = "Collaborative Kanban task management"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pyjwt>=2.8",
    "python-multipart>=0.0.9",
    "httpx>=0.28.1",
    "cryptography>=50.0.2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
